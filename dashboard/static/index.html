<!doctype html>
<html lang="en" data-theme="halloween">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sorter Live</title>
<style>
  :root {
    --bg: #f6f5f2; --panel: #ffffff; --ink: #1d1d1b; --muted: #6b6a66; --line: #e3e1db; --chip: #efeee9;
    --ok: #1f8a4c; --bad: #c4372c; --warn: #b7791f; --accent: #2457d6; --bucket: #ef7d1a; --box: #f2c200;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #141413; --panel: #1e1e1c; --ink: #ecebe6; --muted: #9a988f; --line: #2f2e2b;
      --chip: #2a2927; --ok: #4cc07a; --bad: #ef6b5f; --warn: #e0a64a; --accent: #7aa2ff; }
  }
  /* Halloween (judging gives 5% for Halloween style): the default; the header button switches to plain */
  :root[data-theme="halloween"] {
    --bg: #120d18; --panel: #1d1426; --ink: #f6e9da; --muted: #b59fc4; --line: #3a2a48; --chip: #2b1f38;
    --ok: #8be04e; --bad: #ff4d4d; --warn: #ff9a3c; --accent: #ff7518; --bucket: #ff7518; --box: #ffd23f;
  }
  :root[data-theme="halloween"] body { background: radial-gradient(1100px 480px at 85% -10%, #3b1d52 0%, transparent 60%), var(--bg); }
  :root[data-theme="halloween"] .card { box-shadow: 0 0 0 1px #ff751822, 0 8px 30px #00000055; }
  :root[data-theme="halloween"] button.primary { box-shadow: 0 0 14px #ff751866; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif; }
  header { display: flex; align-items: center; gap: 10px; padding: 12px 16px; }
  h1 { font-size: 18px; margin: 0; }
  h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0; }
  .pill { font-size: 12px; padding: 3px 10px; border-radius: 999px; background: var(--chip); color: var(--muted); }
  .pill.ok { color: var(--ok); } .pill.bad { color: #fff; background: var(--bad); } .pill.warn { color: var(--warn); }
  #b-theme { margin-left: auto; }
  .wrap { padding: 0 16px 16px; display: grid; gap: 12px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; min-width: 0; }
  .head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-bottom: 8px; }
  .head span { font-size: 12px; color: var(--muted); }
  main { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: 12px; align-items: start; }
  @media (max-width: 900px) { main { grid-template-columns: minmax(0, 1fr); } }
  form { display: flex; flex-wrap: wrap; gap: 8px; }
  input[type=text] { flex: 1 1 220px; min-width: 0; font: inherit; padding: 9px 12px; border-radius: 8px; border: 1px solid var(--line);
    background: var(--bg); color: var(--ink); }
  button { font: inherit; padding: 8px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--chip); color: var(--ink); cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  #state { display: flex; align-items: center; gap: 10px; margin: 10px 0 4px; font-size: 18px; font-weight: 600; }
  #state i { font-style: normal; width: 1.4em; text-align: center; }
  #state.busy { color: var(--accent); } #state.warn { color: var(--warn); } #state.bad { color: var(--bad); }
  #job { font-size: 13px; }
  #job .top { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; }
  .badge { font-size: 11px; padding: 1px 8px; border-radius: 999px; background: var(--chip); color: var(--muted); }
  .badge.done, .badge.already_in_bucket, .badge.already_in_square { color: var(--ok); } .badge.running, .badge.sending, .badge.queued { color: var(--accent); }
  .badge.failed, .badge.error, .badge.estop, .badge.rejected, .badge.not_found { color: var(--bad); }
  .items { list-style: none; margin: 6px 0 0; padding: 0; display: grid; gap: 2px; }
  .items li { display: flex; flex-wrap: wrap; gap: 0 8px; } .items .why { color: var(--muted); }
  .fail { color: var(--bad); }
  .muted { color: var(--muted); }
  details { margin-top: 10px; } summary { cursor: pointer; color: var(--muted); font-size: 13px; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0; }
  #more-msg { font-size: 13px; margin-top: 6px; }
  #queue { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  #queue:empty { display: none; }
  #queue .chip { font-size: 13px; padding: 2px 10px; border-radius: 999px; border: 1px solid var(--line, #444); color: var(--muted); }
  #queue .chip.now { color: var(--accent); border-color: var(--accent); font-weight: 600; }
  .camwrap { position: relative; width: 100%; aspect-ratio: 16 / 9; background: #000; border-radius: 8px; overflow: hidden; }
  #cam, #boxes { position: absolute; inset: 0; width: 100%; height: 100%; }
  #cam { object-fit: contain; display: block; }
  #cam.pick { cursor: crosshair; }
  #boxes { pointer-events: none; }
  #boxes text { font: 600 13px sans-serif; }
  #cam-empty { position: absolute; inset: 0; display: grid; place-items: center; color: #bbb; font-size: 13px; }
  #cam-empty[hidden] { display: none; }
  #map { width: 100%; height: auto; display: block; }
  #map text { font: 14px sans-serif; fill: var(--ink); paint-order: stroke; stroke: var(--panel); stroke-width: 3px; }
  #map .mute { fill: var(--muted); }
  #map-foot { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; font-size: 11px; color: var(--muted); margin-top: 4px; }
  .stale { opacity: .55; }
</style>
</head>
<body>
<header>
  <h1>🎃 Sorter</h1>
  <span id="conn" class="pill">connecting…</span>
  <button type="button" id="b-theme" title="Halloween or plain colours">plain colours</button>
</header>
<div class="wrap">
  <section class="card" id="cmd">
    <form id="f">
      <input id="t" type="text" placeholder="red lollipop, green block, tape — each one goes into the bucket" autocomplete="off" maxlength="200" aria-label="what to put into the bucket, comma separated">
      <button class="primary" type="submit">Grasp</button>
      <button type="button" id="b-reset" title="Clear the drop target; after an E-stop, release it first">Reset</button>
    </form>
    <div id="state" class="warn"><i>…</i><span>connecting to the robot</span></div>
    <div id="queue" aria-label="queue: what the arm picks next, in order"></div>
    <div id="job"></div>
    <div id="more-msg"></div>
  </section>
  <main>
    <section class="card">
      <div class="head"><h2>Arm camera</h2><span id="cam-meta"></span></div>
      <div class="camwrap" id="camwrap">
        <img id="cam" alt="what the arm's camera sees">
        <svg id="boxes" aria-hidden="true"></svg>
        <div id="cam-empty">waiting for the first picture…</div>
      </div>
    </section>
    <section class="card">
      <div class="head"><h2>Table map</h2><span id="map-meta"></span></div>
      <svg id="map" viewBox="0 0 560 330" role="img" aria-label="top-down map of the table as the robot remembers it"></svg>
      <div id="map-foot"><span>● seen now · faded = remembered · ◌ = only seen at a picture's edge · ▭ = what the camera sees</span><span id="lib"></span></div>
    </section>
  </main>
</div>
<script>
const $ = (id) => document.getElementById(id);
const el = (tag, text, cls) => { const e = document.createElement(tag); if (text != null) e.textContent = text; if (cls) e.className = cls; return e; };
const NS = "http://www.w3.org/2000/svg";
const mk = (tag, attrs, text) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (text != null) e.textContent = text; return e; };
const norm = (s) => String(s || "").toLowerCase().replace(/^(the|a|an)\s+/, "").trim();
const agoText = (s) => s < 90 ? `${Math.round(s)} s` : `${Math.round(s / 60)} min`;
const keep = { get(k) { try { return localStorage.getItem(k); } catch { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch {} } };

// ---- theme: Halloween by default --------------------------------------------------------------------
function setTheme(t) {
  document.documentElement.dataset.theme = t;
  $("b-theme").textContent = t === "halloween" ? "plain colours" : "🎃 spooky";
  keep.set("theme", t);
}
setTheme(keep.get("theme") || "halloween");
$("b-theme").onclick = () => setTheme(document.documentElement.dataset.theme === "halloween" ? "auto" : "halloween");

// ---- fetching: one JSON a second; the picture by long poll (the server answers when a new one is there, else 304
// after 2 s); both paused while the page is hidden
async function getJSON(url, ms = 3000) {
  const c = new AbortController(), t = setTimeout(() => c.abort(), ms);
  try {
    const r = await fetch(url, { cache: "no-store", signal: c.signal });
    if (!r.ok) throw new Error(`${r.status}`);
    return await r.json();
  } finally { clearTimeout(t); }
}
async function post(url, body) {
  const r = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.detail || `${r.status}`);
  return d;
}

let live = null, liveFails = 0, liveTimer = null;
async function tickLive() {
  clearTimeout(liveTimer);
  if (document.hidden) return;
  try { live = await getJSON("/api/live"); liveFails = 0; render(live); }
  catch { liveFails++; offline(); }
  liveTimer = setTimeout(tickLive, liveFails ? Math.min(1000 * 2 ** liveFails, 5000) : 1000);
}

let etag = null, camTimer = null, camUrl = null, camMeta = null;
const shown = [];  // when the last pictures arrived, for the frame rate
async function tickCam() {
  clearTimeout(camTimer);
  if (document.hidden) return;
  let delay = 0;
  const c = new AbortController(), t = setTimeout(() => c.abort(), 4000);
  try {
    const r = await fetch("/api/frame.jpg", { cache: "no-store", headers: etag ? { "If-None-Match": etag } : {}, signal: c.signal });
    if (r.status === 200) {
      const meta = JSON.parse(decodeURIComponent(r.headers.get("X-Frame-Meta") || "%7B%7D"));
      etag = r.headers.get("ETag");
      await showFrame(URL.createObjectURL(await r.blob()), meta);
    } else if (r.status !== 304) delay = 1500;  // no picture yet
  } catch { delay = 1500; }
  clearTimeout(t);
  camTimer = setTimeout(tickCam, delay);
}
function showFrame(url, meta) {
  return new Promise((done) => {
    const img = $("cam");
    img.onload = () => {
      if (camUrl) URL.revokeObjectURL(camUrl);
      camUrl = url; camMeta = meta;
      $("cam-empty").hidden = true;
      if (meta.w && meta.h) $("camwrap").style.aspectRatio = `${meta.w} / ${meta.h}`;
      shown.push(performance.now());
      while (shown.length > 1 && shown[0] < performance.now() - 5000) shown.shift();
      drawBoxes();
      done();
    };
    img.onerror = () => { URL.revokeObjectURL(url); done(); };
    img.src = url;
  });
}
document.addEventListener("visibilitychange", () => { if (!document.hidden) { tickLive(); tickCam(); } });

// ---- what the current job is after, to mark it in the picture and on the map -----------------------
function target() {
  const r = live && live.running;
  const text = r && (r.item ? r.item.text : r.kind === "grasp" ? r.text : null);
  const hl = live && live.highlight;
  return { text: norm(text || (hl && hl.text)), label: norm(hl && hl.label), xy: hl && hl.xy };
}
function isTarget(names, label) {
  const t = target();
  const all = [label, ...(names || [])].map(norm).filter(Boolean);
  return !!((t.text && all.some((n) => n === t.text || n.includes(t.text))) || (t.label && all.includes(t.label)));
}

// ---- the picture's boxes: objects, the target thick, edge-cut grey (no hand boxes: removed 2026-10-30) ----------
function drawBoxes() {
  const svg = $("boxes"), m = camMeta || {};
  svg.replaceChildren();
  if (!m.w) return;
  svg.setAttribute("viewBox", `0 0 ${m.w} ${m.h}`);
  for (const b of m.boxes || []) {
    if (b.kind === "intruder") continue;  // an old module's hand box: not shown
    const [u0, v0, u1, v1] = b.bbox, part = b.kind === "partial";
    const hit = isTarget(b.names, b.label);
    const colour = hit ? "var(--accent)" : part ? "#9a988f" : "var(--box)";
    svg.appendChild(mk("rect", { x: u0, y: v0, width: u1 - u0, height: v1 - v0, fill: "none", stroke: colour,
      "stroke-width": hit ? 4 : 2, ...(part ? { "stroke-dasharray": "6 4" } : {}) }));
    if (!b.label) continue;
    const text = `${hit ? "▶ " : ""}${b.label}${b.score != null && !hit ? ` ${Number(b.score).toFixed(2)}` : ""}`;
    svg.appendChild(mk("text", { x: u0 + 2, y: v0 > 18 ? v0 - 5 : v1 + 15, fill: colour, stroke: "#000", "stroke-width": 3, "paint-order": "stroke" }, text));
  }
}

// ---- the command block -------------------------------------------------------------------------------
const PHASE = { observe: "searching for", servo: "grasping", descend: "grasping", grab: "grasping", carry: "carrying",
                place: "putting down", sweep: "scanning the table" };
function stateLine(d) {
  if (!d.link.up) return ["warn", "⟳", `reconnecting… ${d.link.error || ""}`];
  if (d.estop) return ["bad", "⛔", "E-STOP pressed — release it, then press Reset"];
  const ph = String(d.phase || "");
  if (ph === "reconnecting") return ["warn", "⟳", "the arm's link is reconnecting"];
  if (d.warm === false) return ["warn", "…", "warming up: loading CLIP and the object library"];
  const r = d.running;
  if (!d.busy || !r) return ["ok", "●", d.seen.at_observe === false ? "ready · arm away from its viewing pose"
    : `ready · sees ${d.seen.objects} object${d.seen.objects === 1 ? "" : "s"}`];
  if (r.kind === "scan") return ["busy", "◎", `scanning the table${r.sweep ? ` · pose ${r.sweep.k}/${r.sweep.n}` : "…"}`];
  if (r.kind === "teach") return ["busy", "◎", `teaching “${r.text}”${r.teach ? ` · looking from pose ${r.teach.k}/${r.teach.n}` : "…"}`];
  if (r.kind === "reset") return ["busy", "↺", "reset: clearing the drop target"];
  const what = r.item ? r.item.text : r.text, s = r.search;
  const nth = r.item ? ` · item ${r.item.k}/${r.item.n}` : "";
  const retry = r.attempt > 1 ? ` · try ${r.attempt}/${r.attempts_max}` : "";
  if (s && s.n && !s.found && (!ph || ph === "observe")) return ["busy", "🔍", `searching for “${what}” · view ${s.k}/${s.n}${nth}${retry}`];
  const verb = PHASE[ph] || (s && s.found ? "grasping" : "working on");
  return ["busy", verb === "carrying" ? "🪣" : "✊", `${verb} “${what}”${verb === "carrying" ? " to the bucket" : ""}${nth}${retry}`];
}
const ITEM_ICON = { done: "✅", already_in_square: "✅", already_in_bucket: "✅", running: "⏳", pending: "·", skipped: "⏭" };
const SATISFIED = ["done", "already_in_square", "already_in_bucket"];
function renderJob(c) {
  const box = $("job");
  box.replaceChildren();
  if (!c) return;
  const top = el("div", null, "top");
  top.appendChild(el("b", c.text === "__reset__" ? "Reset" : c.text === "__scan__" ? "Scan table" : c.text));
  top.appendChild(el("span", String(c.status || "").replace(/_/g, " "), `badge ${c.status}`));
  if (c.label && c.status === "done") top.appendChild(el("span", `picked ${c.label}`, "muted"));
  if (c.duration_s != null) top.appendChild(el("span", `${Number(c.duration_s).toFixed(0)} s`, "muted"));
  if (c.progress) top.appendChild(el("span", c.progress, "muted"));
  box.appendChild(top);
  if (c.fail_reason && !c.items) box.appendChild(el("div", c.fail_reason, SATISFIED.includes(c.status) ? "muted" : "fail"));
  if (c.items && c.items.length) {
    const ul = el("ul", null, "items");
    for (const i of c.items) {
      const li = el("li");
      li.appendChild(el("span", ITEM_ICON[i.status] || "❌"));
      // "of": one of several objects that fit the name, all of which go in ("lollipop (2/2)")
      li.appendChild(el("span", `${i.text}${i.of ? ` (${i.of})` : ""}${i.label && i.label !== i.text ? ` → ${i.label}` : ""}`));
      const why = i.status === "already_in_bucket" ? "already in the bucket"
        : i.fail_reason || (ITEM_ICON[i.status] ? "" : String(i.status || "").replace(/_/g, " "));
      if (why) li.appendChild(el("span", why, "why"));
      ul.appendChild(li);
    }
    box.appendChild(ul);
  }
  if (c.stopped_by) box.appendChild(el("div", `stopped: ${c.stopped_by}`, "fail"));
}

// The queue under the state line: what runs now (highlighted), then what waits, in order
function renderQueue(d) {
  const box = $("queue");
  box.replaceChildren();
  const q = d.queue || [];
  if (!q.length) return;
  const r = d.running, now = r && (r.item ? r.item.text : r.kind === "grasp" ? r.text : null);
  if (now) box.appendChild(el("span", `now: ${now}`, "chip now"));
  q.forEach((t, i) => box.appendChild(el("span", `#${i + 1} ${t}`, "chip")));
}

function offline() {
  const p = $("conn");
  p.className = "pill warn"; p.textContent = "reconnecting…";
  const s = $("state");
  s.className = "warn"; s.firstElementChild.textContent = "⟳"; s.lastElementChild.textContent = "reconnecting to the dashboard server…";
  document.querySelector("main").classList.add("stale");
}

function render(d) {
  document.querySelector("main").classList.toggle("stale", !d.link.up);
  const p = $("conn");
  p.className = `pill ${d.estop ? "bad" : d.link.up ? "ok" : "warn"}`;
  p.textContent = d.estop ? "E-STOP" : d.link.up ? "robot live" : "reconnecting…";
  const [cls, icon, text] = stateLine(d), s = $("state");
  s.className = cls; s.firstElementChild.textContent = icon; s.lastElementChild.textContent = text;
  renderJob(d.command);
  renderQueue(d);
  const fps = shown.length > 1 ? (shown.length - 1) / ((shown[shown.length - 1] - shown[0]) / 1000) : 0;
  const age = d.frame_age_s;
  $("cam-meta").textContent = age == null ? "" : age > 3 ? `no new picture for ${agoText(age)}${d.busy ? " (arm moving)" : ""}`
    : `live · ${fps.toFixed(1)} fps`;
  $("lib").textContent = d.library.store ? `library: ${d.library.store === "atlas" ? "MongoDB Atlas" : "local files"}${d.library.views ? ` · ${Math.round(d.library.views)} views` : ""}` : "";
  drawBoxes();
  drawMap(d);
}

// ---- the map: arm base at the bottom centre, +x (forward) up, +y (left) to the left; mm ---------------
const MAP = { W: 560, H: 330, s: 0.4, base: [280, 315] };
const mapXY = (x, y) => [MAP.base[0] - y * MAP.s, MAP.base[1] - x * MAP.s];
const ageColour = (age) => age < 60 ? "var(--ok)" : age < 300 ? "var(--warn)" : "var(--muted)";
// Labels without collisions: in priority order, each takes the first spot around its marker (right, left, above, below,
// diagonals) that hits no placed label or other marker and stays inside the map; far spots get a leader line
function placeLabels(svg, marks, labels, fixed = []) {
  const boxes = [...fixed];
  const meets = (b, o) => b.x0 < o.x1 && b.x1 > o.x0 && b.y0 < o.y1 && b.y1 > o.y0;
  const hitsMark = (b, own) => marks.some((c) => c !== own && Math.hypot(Math.max(b.x0, Math.min(c.x, b.x1)) - c.x, Math.max(b.y0, Math.min(c.y, b.y1)) - c.y) < c.r);
  for (const L of labels.sort((a, b) => a.prio - b.prio)) {
    const t = mk("text", { x: L.x + 10, y: L.y + 4, ...(L.cls ? { class: L.cls } : {}) }, L.text);
    svg.appendChild(t);
    const own = marks.find((c) => c.x === L.x && c.y === L.y), w = t.getComputedTextLength() || L.text.length * 6.2;
    let best = null;
    for (const far of [0, 16, 34]) {
      for (const [tx, ty] of [[L.x + 11 + far, L.y + 4], [L.x - 11 - far - w, L.y + 4], [L.x - w / 2, L.y - 12 - far], [L.x - w / 2, L.y + 20 + far],
                              [L.x + 8 + far, L.y - 9 - far], [L.x + 8 + far, L.y + 17 + far], [L.x - 8 - far - w, L.y - 9 - far], [L.x - 8 - far - w, L.y + 17 + far]]) {
        const b = { x0: tx - 1, y0: ty - 10, x1: tx + w + 1, y1: ty + 3 };
        if (b.x0 < 0 || b.x1 > MAP.W || b.y0 < 0 || b.y1 > MAP.H || boxes.some((o) => meets(b, o)) || hitsMark(b, own)) continue;
        best = { tx, ty, b, far };
        break;
      }
      if (best) break;
    }
    best = best || { tx: L.x + 11, ty: L.y + 4, b: { x0: L.x + 10, y0: L.y - 6, x1: L.x + 12 + w, y1: L.y + 7 }, far: 0 };
    t.setAttribute("x", best.tx); t.setAttribute("y", best.ty);
    boxes.push(best.b);
    if (best.far) {
      const nx = Math.max(best.b.x0, Math.min(L.x, best.b.x1)), ny = Math.max(best.b.y0, Math.min(L.y, best.b.y1));
      const len = Math.hypot(nx - L.x, ny - L.y) || 1, r0 = (own && own.r) || 8;
      svg.insertBefore(mk("line", { x1: L.x + (nx - L.x) * r0 / len, y1: L.y + (ny - L.y) * r0 / len, x2: nx, y2: ny, stroke: "var(--muted)" }), t);
    }
  }
}
function drawMap(d) {
  const svg = $("map"), m = d.map, [bx, by] = MAP.base, s = MAP.s;
  svg.replaceChildren();
  const [rin, rout] = d.reach_mm.map((r) => r * s);
  svg.appendChild(mk("path", { d: `M ${bx - rout} ${by} A ${rout} ${rout} 0 0 1 ${bx + rout} ${by} L ${bx + rin} ${by} A ${rin} ${rin} 0 0 0 ${bx - rin} ${by} Z`,
    fill: "var(--chip)", stroke: "var(--line)" }));
  // What the camera's newest picture covers on the table
  if (d.view && d.view.length >= 3 && (d.frame_age_s ?? 99) < 5)
    svg.appendChild(mk("polygon", { points: d.view.map((c) => mapXY(c[0], c[1]).join(",")).join(" "), fill: "var(--accent)", "fill-opacity": 0.12,
      stroke: "var(--accent)", "stroke-opacity": 0.5, "stroke-dasharray": "4 3" }));
  // In the bucket: what the module put there this run (the bucket hides it from the map), and anything the map marks inside
  const marks = [], labels = [], fixed = [], delivered = [...(d.in_bucket || [])];
  // The drop target: the bucket (AGENT3's tmap["bucket"]), else a tape square when the map has one
  let dropAt = null;
  if (m && m.bucket && m.bucket.xy) {
    const [px, py] = mapXY(...m.bucket.xy), r = Math.max(10, (m.bucket.radius_mm || 90) * s);
    svg.appendChild(mk("circle", { cx: px, cy: py, r, fill: "var(--bucket)", "fill-opacity": 0.25, stroke: "var(--bucket)", "stroke-width": 3,
      ...(m.bucket.partial ? { "stroke-dasharray": "8 5" } : {}) }));
    svg.appendChild(mk("text", { x: px, y: py + 4, "text-anchor": "middle" }, "🪣"));
    dropAt = [px, py, r + 2];
  } else if (m && m.square && m.square.xy) {
    const pts = Array.isArray(m.square.corners) && m.square.corners.length >= 3 ? m.square.corners.map((c) => mapXY(c[0], c[1])) : null;
    const [sx, sy] = mapXY(...m.square.xy), size = [].concat(m.square.size_mm || [200, 200]), w = (size[1] ?? size[0]) * s, h = size[0] * s;
    const style = { fill: "none", stroke: "#2457d6", "stroke-width": 3, ...(m.square.partial ? { "stroke-dasharray": "10 6" } : {}) };
    svg.appendChild(pts ? mk("polygon", { points: pts.map((p) => p.join(",")).join(" "), ...style }) : mk("rect", { x: sx - w / 2, y: sy - h / 2, width: w, height: h, ...style }));
    dropAt = [sx, sy, Math.max(w, h) / 2];
  }
  if (dropAt) marks.push({ x: dropAt[0], y: dropAt[1], r: dropAt[2] });
  const hl = target();
  for (const o of (m && m.objects) || []) {
    if (o.in_square) { if (o.label) delivered.push(o.label); continue; }  // delivered: off the table, listed at the bucket
    const [px, py] = mapXY(...o.xy), named = !!o.label, age = o.age_s ?? 0, old = !!o.superseded;
    const fade = old ? 0.25 : age <= 10 ? 1 : Math.max(0.4, 1 - 0.6 * (age - 10) / 290);
    const hit = named && !old && ((hl.xy && Math.hypot(hl.xy[0] - o.xy[0], hl.xy[1] - o.xy[1]) < 40) || isTarget(o.names, o.label));
    const g = mk("g", { style: `opacity:${fade.toFixed(2)}${named && !old ? ";cursor:pointer" : ""}` });
    if (hit) g.appendChild(mk("circle", { cx: px, cy: py, r: 13, fill: "none", stroke: "var(--accent)", "stroke-width": 3 }));
    g.appendChild(mk("circle", { cx: px, cy: py, r: 7, fill: named ? ageColour(age) : "var(--muted)", stroke: "var(--panel)", "stroke-width": 2 }));
    if (o.partial) g.appendChild(mk("circle", { cx: px, cy: py, r: 11, fill: "none", stroke: "var(--muted)", "stroke-dasharray": "3 2.5" }));
    g.appendChild(mk("title", {}, `${o.label || "not recognised"} · seen ${agoText(age)} ago · (${o.xy[0].toFixed(0)}, ${o.xy[1].toFixed(0)}) mm`));
    if (named && !old) g.addEventListener("click", () => { $("t").value = o.label; $("t").focus(); });
    svg.appendChild(g);
    marks.push({ x: px, y: py, r: hit ? 14 : o.partial ? 12 : 9 });
    if (named) labels.push({ x: px, y: py, prio: hit ? 0 : old ? 3 : 1, cls: old ? "mute" : "",
      text: `${o.partial ? "≈ " : ""}${o.label}${old ? " · old spot" : age > 15 ? ` · ${agoText(age)}` : ""}` });
  }
  const inside = `in the bucket: ${[...new Set(delivered)].join(", ")}`;
  if (dropAt && delivered.length) labels.push({ x: dropAt[0], y: dropAt[1], prio: 0, text: inside });
  else if (delivered.length) { svg.appendChild(mk("text", { x: 6, y: 16 }, `🪣 ${inside}`)); fixed.push({ x0: 0, y0: 0, x1: MAP.W, y1: 22 }); }
  // The arm: its base, the line to where the flange is now, and the jaws turned by the wrist
  svg.appendChild(mk("rect", { x: bx - 12, y: by - 7, width: 24, height: 12, rx: 3, fill: "var(--muted)" }));
  fixed.push({ x0: bx - 14, y0: by - 9, x1: bx + 14, y1: by + 7 });
  if (d.arm) {
    const [ax, ay] = mapXY(d.arm.x, d.arm.y), a = (d.arm.theta || 0) * Math.PI / 180;
    svg.appendChild(mk("line", { x1: bx, y1: by - 6, x2: ax, y2: ay, stroke: "var(--muted)", "stroke-width": 5, "stroke-linecap": "round", opacity: 0.6 }));
    const jx = 11 * Math.cos(a), jy = 11 * Math.sin(a);
    svg.appendChild(mk("line", { x1: ax - jx, y1: ay - jy, x2: ax + jx, y2: ay + jy, stroke: "var(--ink)", "stroke-width": 3, "stroke-linecap": "round" }));
    svg.appendChild(mk("circle", { cx: ax, cy: ay, r: 5, fill: "var(--ink)" }));
    marks.push({ x: ax, y: ay, r: 12 });
    labels.push({ x: ax, y: ay, prio: 0, cls: "mute", text: `arm · z ${Math.round(d.arm.z)}` });
  }
  placeLabels(svg, marks, labels, fixed);
  const n = ((m && m.objects) || []).filter((o) => !o.in_square && !o.superseded).length;
  $("map-meta").textContent = d.map_failing ? "⚠ map not updating" : !m ? "no map yet"
    : m.cleared_s_ago != null && !n ? `cleared ${agoText(m.cleared_s_ago)} ago` : `${n} object${n === 1 ? "" : "s"} · updated ${agoText(m.age_s)} ago`;
}

// ---- commands ------------------------------------------------------------------------------------------
async function send(text, what) {
  try { await post("/api/commands", { text }); $("more-msg").textContent = ""; }
  catch (e) { $("more-msg").textContent = `${what}: ${e.message}`; }
  tickLive();
}
$("f").addEventListener("submit", (ev) => {
  ev.preventDefault();
  const text = $("t").value.trim();
  if (text) { send(text, "grasp"); $("t").value = ""; }
});
$("b-reset").onclick = () => send("__reset__", "reset");
// The camera and the map are view only: the box above is the one control (user, 2026-10-30)

tickLive();
tickCam();
</script>
</body>
</html>
